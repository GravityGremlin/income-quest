    function t(key, fields = {}) {
      if (!_.isEmpty(fields) && (key in translations.data) && translations.data[key].includes('%')) {
        let text = translations.data[key];
        const positions = [];
        let hasObject = false;

        // Assumes that there are no overlaps
        for (const field in fields) {

          if (typeof fields[field] !== 'object') {
            // simple text replacement
            text = text.replace('%' + field, fields[field]);;
          } else {
            const idx = text.indexOf('%' + field);
            positions.push([idx, idx + field.length + 1]);
          }
        }

        let idx = 0;
        const output = [];

        for (const position of positions) {
          const [startIdx, endIdx] = position;

          // Non-parameter section before next parameter-section
          if (startIdx > idx) {
            output.push(text.substring(idx, startIdx));
            idx = startIdx;
          }

          const field = text.substring(idx + 1, endIdx);
          const value = fields[field];

          if (typeof value === 'object') hasObject = true;

          output.push(value);
          idx = endIdx;
        }

        // Non-parameter section after last parameter section
        if (idx < text.length) output.push(text.substring(idx));

        return hasObject ? output : output.join('');
      }

      if (!(key in translations.data)) {
        return key;
      }

      return translations.data[key];
    }
